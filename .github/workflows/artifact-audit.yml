name: Artifact audit tests
on:
  pull_request:
    paths:
      - 'audits/OJ-001/**'
      - 'scripts/omni_jev_audit.py'
      - 'scripts/omni_jev_smoke_colmodernvbert.py'
      - 'tests/test_omni_jev_audit.py'
      - '.github/workflows/artifact-audit.yml'
permissions:
  contents: read
jobs:
  offline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_omni_jev_audit.py' -v
      - run: python scripts/omni_jev_audit.py validate audits/OJ-001/manifest.json
