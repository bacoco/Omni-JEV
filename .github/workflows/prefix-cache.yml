name: Prefix cache tests

on:
  pull_request:
    paths:
      - 'src/omni_jev/prefix_*.py'
      - 'tests/*prefix*.py'
      - 'pyproject.toml'
      - '.github/workflows/prefix-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[prefix,test]' transformers==5.3.0
      - run: python -m pytest -q
